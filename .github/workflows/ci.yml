name: CI

# Both triggers are load-bearing, because work reaches main two ways.
#
# `push` on every branch covers the maintainer's own branches, which are merged
# locally and never raise a PR — without it CI would only ever test code that
# had already shipped. `pull_request` covers outside contributions, whose pushes
# fire in the contributor's fork rather than here; without it a fork's PR would
# arrive untested. See CONTRIBUTING.md.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A run for an outdated push is wasted minutes: keep only the newest per branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
