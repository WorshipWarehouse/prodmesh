name: Docs site

# Builds the public documentation site and, from main, publishes it to
# GitHub Pages.
#
# Every branch builds with --strict so a broken link or a bad reference fails
# here rather than going live. Only main deploys, matching the rule that
# publishing steps are gated.
#
# ONE-TIME SETUP: Settings → Pages → Source: "GitHub Actions". Until that is
# done the deploy job fails with a 404 and the build job still passes, which
# is the intended behaviour — the site is checked on every push whether or not
# anyone has chosen to publish it yet.
on:
  push:
    branches: ['**']
    paths:
      - 'docs/wiki/**'
      - 'mkdocs.yml'
      - 'docs/requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      # --strict turns warnings into failures: a link to a page that no longer
      # exists is exactly the rot this site is meant to avoid.
      - name: Build (strict)
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
